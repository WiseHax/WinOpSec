name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Test (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PowerShell 7
            shell: pwsh
          - name: Windows PowerShell 5.1
            shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester & PSScriptAnalyzer
        shell: ${{ matrix.shell }}
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Force

      - name: Validate module manifest
        shell: ${{ matrix.shell }}
        run: Test-ModuleManifest ./WinOpSec.psd1

      - name: Import all modules (parse check)
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem modules/*.psm1 | ForEach-Object {
            Import-Module $_.FullName -Force -DisableNameChecking
            Write-Host "imported $($_.Name)"
          }

      - name: PSScriptAnalyzer
        shell: ${{ matrix.shell }}
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error
          $results | Format-Table -AutoSize
          if ($results | Where-Object Severity -eq 'Error') {
            throw "PSScriptAnalyzer reported errors."
          }

      - name: Run Pester tests
        shell: ${{ matrix.shell }}
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.Run.Exit = $true
          Invoke-Pester -Configuration $cfg
